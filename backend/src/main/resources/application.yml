spring:
  application:
    name: orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orchestrator}
    username: ${DB_USER:orchestrator}
    password: ${DB_PASSWORD:orchestrator}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

orchestrator:
  roles: ${ROLES:api,scheduler,worker}
  worker:
    concurrency: ${WORKER_CONCURRENCY:4}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:500}
    heartbeat-interval-ms: ${WORKER_HEARTBEAT_INTERVAL_MS:5000}
    stale-heartbeat-ms: ${WORKER_STALE_HEARTBEAT_MS:30000}
  scheduler:
    scan-interval-ms: ${SCHEDULER_SCAN_INTERVAL_MS:2000}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  rate-limit:
    enabled: true
    permits-per-second: ${RATE_LIMIT_PERMITS_PER_SECOND:20}
    burst: ${RATE_LIMIT_BURST:50}
  webhook:
    max-delivery-attempts: 3
    delivery-timeout-ms: 5000
  lock:
    lease-time-ms: 10000
  idempotency:
    ttl-minutes: 1440

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.buildathon.orchestrator: INFO
