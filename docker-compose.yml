name: workflow-orchestrator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ROLES: api
      DB_URL: jdbc:postgresql://postgres:5432/orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    environment:
      ROLES: scheduler
      DB_URL: jdbc:postgresql://postgres:5432/orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-1:
    build: .
    environment:
      ROLES: worker
      WORKER_CONCURRENCY: 4
      DB_URL: jdbc:postgresql://postgres:5432/orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-2:
    build: .
    environment:
      ROLES: worker
      WORKER_CONCURRENCY: 4
      DB_URL: jdbc:postgresql://postgres:5432/orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # A second scheduler to demonstrate leader election: run `docker compose logs
  # scheduler-2 | grep leader` to see it not acquiring leadership.
  scheduler-2:
    build: .
    environment:
      ROLES: scheduler
      DB_URL: jdbc:postgresql://postgres:5432/orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
